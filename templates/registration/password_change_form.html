{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block seo_meta %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<section class="account-page"><div class="container account-layout"><div class="account-form-card">
    <span class="page-eyebrow">Account security</span>
    <h1>Change Password</h1>
    <p>Choose a secure password you do not use elsewhere.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Change Password</button></form>
</div></div></section>
{% endblock %}
