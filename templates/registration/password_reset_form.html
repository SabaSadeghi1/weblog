{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<section class="account-page"><div class="container account-layout"><div class="account-form-card">
    <span class="page-eyebrow">Recover access</span>
    <h1>Reset Password</h1>
    <p>Enter your email and we will send you a reset link.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Send Reset Link</button></form>
</div></div></section>
{% endblock %}
