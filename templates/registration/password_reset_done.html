{% extends "base.html" %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<section class="account-page"><div class="container account-layout"><div class="account-form-card">
    <span class="page-eyebrow">Email sent</span>
    <h1>Check your inbox.</h1>
    <p>If an account exists for that email, a password reset link is on its way.</p>
    <a class="profile-action" href="{% url 'login' %}">Back to login</a>
</div></div></section>
{% endblock %}
