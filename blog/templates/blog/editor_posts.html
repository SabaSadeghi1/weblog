{% extends "base.html" %}

{% block title %}
Editor Posts
{% endblock %}

{% block content %}

<div class="container">

    <h1>Editor Posts</h1>

    {% for post in posts %}

        <div>

            <h3>{{ post.title }}</h3>

            <p>
                Author:
                {{ post.author_user.username }}
            </p>

            <p>
                Status:
                {{ post.get_status_display }}
            </p>

            <a href="{% url 'blog:post_review' post.id %}">
                Review
            </a>

        </div>

        <hr>

    {% empty %}

        <p>No posts found.</p>

    {% endfor %}

</div>

{% endblock %}
