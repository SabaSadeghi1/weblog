{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block seo_meta %}
<meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block content %}

<div class="container">

    <h1>Edit Profile</h1>

    <form
        method="post"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.media }}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
