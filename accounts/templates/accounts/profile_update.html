{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block seo_meta %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<section class="account-page">
    <div class="container account-layout">
        <div class="account-form-card">
            <span class="page-eyebrow">Profile settings</span>
            <h1>Edit Profile</h1>
            <p>Keep your public identity fresh and recognizable.</p>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.media }}
                {{ form.as_p }}
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
